<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Florence: a modern fleur-de-lis, flat blue on a transparent background -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cb4ff"/>
      <stop offset="1" stop-color="#1f4fe0"/>
    </linearGradient>
    <!-- the left half of the lily; the right half is its mirror image -->
    <g id="half">
      <path d="M116 158 C 72 162 24 142 22 100 C 21 78 36 64 54 64 C 67 64 77 73 77 85 C 77 96 69 101 62 100 C 70 112 86 120 104 121 C 110 122 114 123 118 126 Z"/>
      <path d="M106 176 C 82 182, 68 204, 74 232 C 90 218, 104 210, 116 200 Z"/>
    </g>
  </defs>
  <g fill="url(#blue)">
    <path d="M128 8 C 152 42, 156 96, 128 160 C 100 96, 104 42, 128 8 Z"/>
    <use href="#half"/>
    <use href="#half" transform="translate(256 0) scale(-1 1)"/>
    <rect x="74" y="160" width="108" height="20" rx="10"/>
    <path d="M128 184 C 112 200, 112 224, 128 246 C 144 224, 144 200, 128 184 Z"/>
  </g>
</svg>
